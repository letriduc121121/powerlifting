<!-- ===== ADMIN STATS SECTION ===== -->
<section id="adminStatsSection" class="admin-stats-section" style="display: none;">
  <div class="container">
    <div class="admin-stats-card reveal">
      <h2 class="admin-stats-title">📊 Thống Kê Tương Tác</h2>
      <div class="admin-stats-grid">
        <div class="admin-stat-item">
          <span class="admin-stat-label">Tổng Lượt Xem Video</span>
          <span class="admin-stat-number" id="totalVideoViews">0</span>
        </div>
        <div class="admin-stat-item">
          <span class="admin-stat-label">Tổng Lượt Đọc Tin Tức</span>
          <span class="admin-stat-number" id="totalNewsViews">0</span>
        </div>
      </div>

      <!-- Chi tiết video -->
      <div class="admin-stats-detail">
        <h3 class="admin-stats-subtitle">🎬 Chi Tiết Lượt Xem Video</h3>
        <div class="admin-stats-table-wrap">
          <table class="admin-stats-table">
            <thead>
              <tr><th>Tên Video</th><th>Tags</th><th>Lượt Xem</th></tr>
            </thead>
            <tbody id="videoStatsBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="videoStatsPagination" style="margin-top: 15px; justify-content: flex-end; gap: 4px;"></div>
      </div>

      <!-- Chi tiết tin tức -->
      <div class="admin-stats-detail">
        <h3 class="admin-stats-subtitle">📰 Chi Tiết Lượt Đọc Tin Tức</h3>
        <div class="admin-stats-table-wrap">
          <table class="admin-stats-table">
            <thead>
              <tr><th>Tiêu Đề</th><th>Danh Mục</th><th>Ngày</th><th>Lượt Xem</th></tr>
            </thead>
            <tbody id="newsStatsBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="newsStatsPagination" style="margin-top: 15px; justify-content: flex-end; gap: 4px;"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== NEWS SECTION ===== -->
<section id="tin-tuc" class="news-section">
  <div class="container">
    <div class="section-header-wrap">
      <div class="section-label-lg">Tin Tức & Sự Kiện</div>
      <button
        class="btn btn-primary btn-sm add-card-btn"
        onclick="openAddNewsModal()"
      >
        + Thêm Tin
      </button>
    </div>

    <!-- Advanced Filters: Search + Categories -->
    <div class="news-filters-wrap reveal">
      <div class="news-categories" id="newsCategories">
        <!-- Rendered by app.js -->
      </div>
      <div class="news-search-box">
        <input
          type="search"
          id="newsSearchInput"
          placeholder="Tìm kiếm bài viết..."
          autocomplete="off"
        />
      </div>
    </div>

    <!-- News Grid -->
    <div class="news-grid reveal" id="newsGrid">
      <!-- Rendered by app.js -->
    </div>

    <!-- Pagination Controls -->
    <div
      class="pagination-wrap reveal"
      id="newsPagination"
      style="display: none"
    >
      <!-- Rendered by app.js -->
    </div>
  </div>
</section>

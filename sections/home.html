<!-- ===== HERO SECTION ===== -->
<section id="home" class="hero">
  <div class="container">
    <div class="hero-layout">
      <div class="hero-content">
        <div class="hero-eyebrow">Giải Đấu Chính Thức 2026</div>
        <h1 class="hero-title">
          POWER<br /><span class="accent">LIFTING</span><br />2026
        </h1>
        <p class="hero-subtitle">Nơi những người mạnh nhất tranh tài</p>
        <div class="hero-meta">
          <div class="hero-meta-item">
            <span class="icon"><i data-lucide="calendar" class="w-5 h-5 text-[#ffd600]"></i></span>
            <span class="field-wrap">
              <span class="editable-field" id="heroDate" data-key="heroDate">20/08/2026 – 21/08/2026</span>
              <button
                class="field-edit-icon"
                onclick="editHeroField('heroDate', 'Chỉnh sửa Thời gian')"
              >
                ✏️
              </button>
            </span>
          </div>
          <div class="hero-meta-item">
            <span class="icon"><i data-lucide="map-pin" class="w-5 h-5 text-[#ffd600]"></i></span>
            <span class="field-wrap">
              <span class="editable-field" id="heroLocation" data-key="heroLocation">Thành phố Hà Nội</span>
              <button
                class="field-edit-icon"
                onclick="editHeroField('heroLocation', 'Chỉnh sửa Địa điểm')"
              >
                ✏️
              </button>
            </span>
          </div>
        </div>
        <div class="hero-actions">
          <a href="#giai-dau" class="btn btn-yellow">Xem Giải Đấu</a>
          <a href="#huong-dan" class="btn btn-outline-white">Hướng Dẫn</a>
        </div>
      </div>
      <div class="hero-right">
        <div class="stat-box">
          <span class="num" id="statAthletes">200+</span><span class="lbl">VĐV đăng ký</span>
        </div>
        <div class="stat-box">
          <span class="num" id="statClasses">12</span><span class="lbl">Hạng Cân</span>
        </div>
        <div class="stat-box">
          <span class="num" id="statEvents">3</span><span class="lbl">Nội Dung Thi</span>
        </div>
      </div>
    </div>
  </div>
</section>

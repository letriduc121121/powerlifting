<!-- ===== CHATBOT ASSISTANT ===== -->
<button class="chatbot-toggle" id="chatToggle" onclick="toggleChat()">
  <img
    id="chatToggleMascot"
    src="/images/chatbot-logo.png"
    class="chat-icon chatbot-mascot-img"
    alt="Mascot"
    style="
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    "
  />
  <span class="close-icon">✕</span>
</button>
<div class="chatbot-box" id="chatBox">
  <div class="chatbot-header">
    <div
      class="ch-avatar"
      style="
        overflow: hidden;
        width: 36px;
        height: 36px;
        border-radius: 50%;
      "
    >
      <img
        id="chatHeaderMascot"
        src="/images/chatbot-logo.png"
        alt="Mascot Avatar"
        style="width: 100%; height: 100%; object-fit: contain"
      />
    </div>
    <div class="ch-info">
      <h4>PL Assistant</h4>
      <p>Hỏi về Powerlifting & Giải đấu</p>
    </div>
  </div>
  <div class="chatbot-messages" id="chatMessages">
    <div class="msg bot">
      Xin chào! 👋 Tôi có thể giúp bạn về thông tin giải đấu Powerlifting
      2026. Bạn muốn hỏi gì?
    </div>
  </div>
  <div class="quick-replies" id="quickReplies">
    <button class="qr-btn" onclick="sendQuickReply('Lịch thi đấu?')">
      📅 Lịch thi đấu
    </button>
    <button class="qr-btn" onclick="sendQuickReply('Đăng ký như thế nào?')">
      📝 Đăng ký
    </button>
    <button class="qr-btn" onclick="sendQuickReply('Powerlifting là gì?')">
      ❓ PL là gì
    </button>
    <button
      class="qr-btn"
      onclick="sendQuickReply('Hạng cân nào có thể tham gia?')"
    >
      ⚖️ Hạng cân
    </button>
  </div>
  <div class="chatbot-input">
    <input
      type="text"
      id="chatInput"
      placeholder="Nhập câu hỏi..."
      onkeydown="if (event.key === 'Enter') sendChatMessage();"
    />
    <button onclick="sendChatMessage()">➤</button>
  </div>
</div>
